# Cloudflare Workers — static asset deployment.
# Assets-only Worker: no server code, so every request is served straight from
# Cloudflare's edge. Static asset requests are not billed and do not count
# against the Workers free-tier request limit.
#
#   npx wrangler deploy        deploy to <name>.<subdomain>.workers.dev
#   npx wrangler dev           preview locally on http://localhost:8787

name = "tickdesk-site"
compatibility_date = "2026-09-20"

[assets]
directory = "./public"
# One-page site: unknown paths fall back to index.html rather than a bare 404.
not_found_handling = "single-page-application"
